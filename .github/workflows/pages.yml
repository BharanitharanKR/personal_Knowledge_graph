name: Download site

# Publishes docs-site/ to GitHub Pages.
#
# Pages' branch-deploy mode only accepts "/" or "/docs" as a source, and docs/
# already holds the API and format reference. Deploying through Actions lets the
# site live in its own folder without disturbing that.
on:
  push:
    branches: [rebrand]
    paths: ["docs-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
